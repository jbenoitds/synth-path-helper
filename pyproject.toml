[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synth-path-helper"
version = "0.1.0"
description = "Rule-based functional-group detection and reaction prediction for organic chemistry, from SMILES, built on RDKit."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "synth-path-helper contributors" }]
keywords = ["chemistry", "organic chemistry", "rdkit", "smiles", "reaction prediction", "education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = ["rdkit>=2022.3.3"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
synth-path-helper = "synth_path_helper.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
synth_path_helper = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
